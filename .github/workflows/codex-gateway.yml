name: Codex gateway
on:
  pull_request:
    paths:
      - 'server/codex/**'
      - '.github/workflows/codex-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'server/codex/**'
      - '.github/workflows/codex-gateway.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/codex/package-lock.json
      - run: npm ci --prefix server/codex --omit=dev
      - run: npm test --prefix server/codex
