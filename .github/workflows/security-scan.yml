name: Security scan

# Why this exists: the one accurate external report we ever received was
# Postgres credentials committed to public repo history. The finding itself
# was cheap to fix; what was missing was a gate that would have caught it
# before the push. This is that gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so a secret introduced in an earlier commit on the
          # branch is caught, not just the tip diff.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    # Registry availability and existing SDK-54 advisories must not block APKs.
    # Findings remain visible in the summary and downloadable raw JSON.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit the complete lockfile
        continue-on-error: true
        run: npm audit --json > npm-audit.json
      - name: Audit npm production dependencies
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --json > npm-audit-production.json
      - name: Summarize both audit results
        if: always()
        run: node scripts/summarize-npm-audit.mjs npm-audit.json npm-audit-production.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.sha }}
          path: |
            npm-audit.json
            npm-audit-production.json
          if-no-files-found: error
